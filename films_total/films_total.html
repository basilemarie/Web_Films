<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'acceuil</title>
    <script src="film_total.js" defer></script>
    <link rel="stylesheet" href="films_total.css">

</head>

<body>

    <header class="banniere">

        <a href="../film_main/film_main.html">
            <img class="logo" src="../assets/logo_tmdb.png">
        </a>

    </header>

    <div class="top_page">
        <h1>Voilà la liste des films du moment!</h1>
        <div id="searchbar">
            <input type="texte" id="type_bar" placeholder="Rechercher un film">
            <button onclick="renderSearch()">Chercher</button>
        </div>
    </div>

    <div class="interface">
        <div>
            <ul class="choice">
                <li><input type="checkbox" class= "category" value="Action"> Action</li>
                <li><input type="checkbox" class= "category" value="Aventure">Aventure</li>
                <li><input type="checkbox" class= "category" value="Animation">Animation</li>
                <li><input type="checkbox" class= "category" value="Comédie">Comédie</li>
                <li><input type="checkbox" class= "category" value="Crime">Crime</li>
                <li><input type="checkbox" class= "category" value="Documentaire">Documentaire</li>
                <li><input type="checkbox" class= "category" value="Drame">Drame</li>
                <li><input type="checkbox" class= "category" value="Familial">Familial</li>
                <li><input type="checkbox" class= "category" value="Fantastique"> Fantastique</li>
                <li><input type="checkbox" class= "category" value="Histoire">Histoire</li>
                <li><input type="checkbox" class= "category" value="Horreur"> Horreur</li>
                <li><input type="checkbox" class= "category" value="Musique"> Musique</li>
                <li><input type="checkbox" class= "category" value="Mystère"> Mystère</li>
                <li><input type="checkbox" class= "category" value="Romance"> Romance</li>
                <li><input type="checkbox" class= "category" value="Science-Fiction">Science-fiction</li>
                <li><input type="checkbox" class= "category" value="Téléfilm">Téléfilm</li>
                <li><input type="checkbox" class= "category" value="Thriller">Thriller</li>
                <li><input type="checkbox" class= "category" value="Guerre">Guerre</li>
                <li><input type="checkbox" class= "category" value="Western">Western</li>

            <button id="selection_button" onclick="display_genres()">Valider</button>
            <button id="reset_button" onclick="render_initialFilms()">Reset</button>

        </div>
        <div id="wrapper">
        </div>
    </div>
        
    

</body>
