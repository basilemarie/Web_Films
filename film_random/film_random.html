<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage de Films</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        img {
            max-width: 300px;
            margin-top: 10px;
        }
    </style>
    <link rel="stylesheet" href="film_random.css">
</head>

<body>

    <header class="banniere">

        <a href="../film_main/film_main.html">
            <img class="logo" src="../assets/logo.png">
        </a>

    </header>

    <h1>Film aléatoire</h1>
    <button class ="researchButton" onclick="renderFilm()">Obtenir un film</button>

    </div>
    <div id="wrapper">
    </div>



    <script>

        const API_KEY = '235f18c6dedac9eb6cd3020b665313ec'; // Remplace par ta clé TMDB
        const BASE_URL = 'https://api.themoviedb.org/3';

        async function renderFilm() {

            wrapper.innerHTML = '';

            const randomId = Math.floor(Math.random() * 500) + 1; // ID aléatoire
            const response = await fetch(`${BASE_URL}/movie/${randomId}?api_key=${API_KEY}&language=fr`);
            const film = await response.json();

            if (film.title) {
                const base_El = document.createElement("div");
                document.getElementById("wrapper").appendChild(base_El);
                base_El.className = "film";


                const imageEl = document.createElement("img");
                imageEl.src = `https://image.tmdb.org/t/p/w500${film.poster_path}`;
                imageEl.className = 'poster';
                base_El.appendChild(imageEl);

                const nameEl = document.createElement("div");
                nameEl.textContent = film.title;
                base_El.appendChild(nameEl);
                nameEl.className = 'title'

                const noteEl = document.createElement("div");
                noteEl.textContent = `⭐ Note : ${film.vote_average.toFixed(1)} / 10`;
                base_El.appendChild(noteEl);
                noteEl.className = 'note'

                const filmIdEl = document.createElement("div");
                filmIdEl.textContent = film.id;
                filmIdEl.className = "id_film";
                filmIdEl.style.display = "none"; // Cacher l'élément
                base_El.appendChild(filmIdEl);

                const url_genre = `https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=fr-FR`;

                const genreEl = document.createElement("div");
                const response_genre = await fetch(url_genre);
                const data_genre = await response_genre.json();
                genreEl.textContent = data_genre.genres[0].name;
                genreEl.className = "genre";
                base_El.appendChild(genreEl);

            } else {
                const base_El = document.createElement("div");
                document.getElementById("wrapper").appendChild(base_El);
                base_El.className = "film";

                const message = document.createElement("h1");
                message.textContent = "Pas de film trouvé";
                base_El.appendChild(message);
                message.className = 'title'

            }

        }
    </script>
</body>

</html>
